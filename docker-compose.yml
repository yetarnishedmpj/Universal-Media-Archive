services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-media-archive-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: universal_media_archive
      CORS_ORIGINS: "*"
      ENABLE_DOCS: "true"
      SEED_ON_STARTUP: "true"
      SEED_FORCE_RESET: "false"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: universal-media-archive-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mongo_data:
